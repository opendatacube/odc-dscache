name: Run Code Checks

on:
  pull_request:
  push:

jobs:
  build-wheels:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.10"

    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      id: wheels_cache
      with:
        path: ./wheels
        key: wheels-${{ github.sha }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools
        python -m pip install --upgrade \
         toml \
         wheel \
         twine \
         packaging
        python -m pip freeze

    - name: Build Clean Packages
      run: |
        mkdir -p ./wheels/clean
        python setup.py bdist_wheel --dist-dir ./wheels/clean/
        python setup.py sdist --dist-dir ./wheels/clean/
        find ./wheels/clean -type f

    - name: Patch Package Versions
      run: |
        find . -name _version.py | xargs python ./scripts/patch_version.py ${GITHUB_RUN_NUMBER:-0}

    - name: Build Dev Packages
      run: |
        mkdir -p ./wheels/dev
        python setup.py bdist_wheel --dist-dir ./wheels/dev/
        python setup.py sdist --dist-dir ./wheels/dev/
        find ./wheels/dev -type f

  build-test-env-base:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      id: conda_cache
      with:
        path: /tmp/test_env
        key: ${{ runner.os }}-test-env-py310-${{ hashFiles('tests/test-env-py310.yml') }}

    - uses: conda-incubator/setup-miniconda@835234971496cad1653abb28a638a281cf32541f # v3.2.0
      if: steps.conda_cache.outputs.cache-hit != 'true'
      with:
        channels: conda-forge,defaults
        channel-priority: true
        activate-environment: ""
        mamba-version: "*"
        use-mamba: true

    - name: Dump Conda Environment Info
      shell: bash -l {0}
      if: steps.conda_cache.outputs.cache-hit != 'true'
      run: |
          conda info
          conda list
          conda -V
          conda config --show-sources
          conda config --show
          printenv | sort

    - name: Build Python Environment for Testing
      shell: bash -l {0}
      if: steps.conda_cache.outputs.cache-hit != 'true'
      run: |
        mamba env create -f tests/test-env-py310.yml -p /tmp/test_env

    - name: Check Python Env
      shell: bash -l {0}
      if: steps.conda_cache.outputs.cache-hit != 'true'
      run: |
        mamba env export -p /tmp/test_env

  run-mypy:
    runs-on: ubuntu-latest
    needs:
      - build-test-env-base

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
    - name: Get Conda Environment from Cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      id: conda_cache
      with:
        path: /tmp/test_env
        key: ${{ runner.os }}-test-env-py310-${{ hashFiles('tests/test-env-py310.yml') }}

    - name: Update PATH
      shell: bash
      run: |
        echo "/tmp/test_env/bin" >> $GITHUB_PATH

    - name: Check with mypy
      shell: bash
      run: |
        mypy --explicit-package-bases --python-version=3.10 odc


  test-with-coverage:
    runs-on: ubuntu-latest

    needs:
      - build-test-env-base

    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - name: Get Conda Environment from Cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      id: conda_cache
      with:
        path: /tmp/test_env

        key: ${{ runner.os }}-test-env-py310-${{ hashFiles('tests/test-env-py310.yml') }}

    - name: Update PATH
      shell: bash
      run: |
        echo "/tmp/test_env/bin" >> $GITHUB_PATH

    - name: Install in Edit mode
      shell: bash
      run: |
        pip install -e . --no-deps

    - name: Run Tests
      shell: bash
      run: |
        echo "Running Tests"
        pytest --cov=. \
        --cov-report=html \
        --cov-report=xml:coverage.xml \
        --timeout=30 \
        tests

      env:
        DASK_TEMPORARY_DIRECTORY: /tmp/dask

    - name: Upload Coverage
      if: |
        github.repository == 'opendatacube/odc-dscache'

      uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
      with:
        use_oidc: true
        fail_ci_if_error: false
        verbose: false


  test-wheels:
    runs-on: ubuntu-latest

    needs:
      - build-test-env-base
      - build-wheels

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - name: Get Wheels from Cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      id: wheels_cache
      with:
        path: ./wheels
        key: wheels-${{ github.sha }}

    - name: Get Conda Environment from Cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      id: conda_cache
      with:
        path: /tmp/test_env
        key: ${{ runner.os }}-test-env-py310-${{ hashFiles('tests/test-env-py310.yml') }}

    - name: Update PATH
      shell: bash
      run: |
        echo "/tmp/test_env/bin" >> $GITHUB_PATH

    - name: Install wheels for testing
      shell: bash
      run: |
        which python
        which datacube

        ls -lh wheels/clean
        python -m pip install --no-deps wheels/clean/*whl
        python -m pip check || true

    - name: Run Tests
      shell: bash
      run: |
        echo "Running Tests"
        pytest --timeout=30 tests
